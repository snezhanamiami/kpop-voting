function shareUrl(){return location.origin+location.pathname+'#artist-'+chosen}
function shareVK(){window.open('https://vk.com/share.php?url='+encodeURIComponent(shareUrl()),'_blank')}
function shareTG(){window.open('https://t.me/share/url?url='+encodeURIComponent(shareUrl())+'&text='+encodeURIComponent('Поддержи '+artist().name+' в моём городе!'),'_blank')}
function copyLink(){navigator.clipboard.writeText(shareUrl()).then(()=>toast('Ссылка скопирована')).catch(()=>toast('Не удалось скопировать'))}
function saveStory(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d');const g=c.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#793d9b');g.addColorStop(.5,'#e25b9e');g.addColorStop(1,'#211236');c.fillStyle=g;c.fillRect(0,0,1080,1920);c.fillStyle='white';c.textAlign='center';c.font='bold 55px Arial';c.fillText('SEOUL SIGNAL',540,360);c.font='bold 140px Arial';c.fillText(artist().name,540,850);c.font='bold 52px Arial';c.fillText('Голосуй за '+artist().name+'!',540,1040);c.fillText('Город: '+(state.votes[chosen]||city),540,1130);c.font='44px Arial';c.fillText('Присоединяйся! Голосуй со мной ♥',540,1400);const link=document.createElement('a');link.download='seoul-signal-story.png';link.href=canvas.toDataURL('image/png');link.click()}
