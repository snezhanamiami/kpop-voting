<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEOUL SIGNAL — K-pop голосование</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f8f5ff;background:#0c0919}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#fa69b5;color:#17091a;font-weight:700}button.alt{background:#302441;color:white}button.ghost{background:transparent;color:#efc9e5;border:1px solid #665271}button:disabled{opacity:.4;cursor:not-allowed}header{position:sticky;top:0;background:#18112beF;backdrop-filter:blur(16px);z-index:3;border-bottom:1px solid #372746}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0}.logo{font-size:22px;font-weight:900;letter-spacing:-1px;cursor:pointer}.logo span,.accent{color:#ff72bc}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font-size:13px;padding:9px 12px;background:transparent;color:#e7d8f2}nav button.active{background:#413052}.wrap{width:min(1050px,92%);margin:auto}main{min-height:72vh;padding:38px 0 60px}.hero{border-radius:24px;background:radial-gradient(circle at 85% 20%,#71335b,transparent 45%),linear-gradient(125deg,#31224b,#171125);padding:clamp(24px,6vw,65px);margin-bottom:32px}.eyebrow{color:#ff9bd1;font-weight:800;letter-spacing:2px;font-size:12px}h1{font-size:clamp(35px,6vw,68px);line-height:1.04;margin:20px 0}h2{font-size:30px;margin:10px 0 20px}h3{margin:10px 0}p{color:#c7b9d7;line-height:1.6}.muted{color:#b5a8c8;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#211931;border:1px solid #44304e;border-radius:18px;overflow:hidden}.card .body{padding:20px}.art{height:180px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--tone),#17112a);font-weight:900;font-size:34px;letter-spacing:2px}.card button{margin-top:8px}.panel{background:#241b35;border:1px solid #493858;border-radius:18px;padding:24px;margin:20px 0}.form{max-width:490px}.form label{display:block;margin:18px 0 8px}.form input,.form select,select{width:100%;padding:14px;border-radius:12px;background:#171124;border:1px solid #665271;color:#fff}.form input:focus{outline:2px solid #ff79bf}.bar{background:#4d385b;border-radius:100px;height:10px;overflow:hidden}.bar div{height:100%;background:#fa69b5}.pill{background:#3d2b4b;border-radius:100px;padding:6px 12px;font-size:12px}.steps{display:grid;gap:12px}.step{display:flex;gap:18px;align-items:flex-start}.step b{color:#ff79bf;font-size:26px}.share-art{max-width:420px;aspect-ratio:9/12;background:linear-gradient(155deg,#763a85,#e65c9b,#251139);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:20px;padding:30px;margin:20px auto}.share-art strong{font-size:55px}.share-art p{color:white}.footer{border-top:1px solid #3c2e4b;padding:25px 0;color:#988aa8}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5d2e9;color:#25112b;padding:12px 20px;border-radius:14px;display:none;z-index:5}.hide{display:none!important}@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}.art{height:120px;font-size:24px}nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}header .wrap{display:block}header .wrap>div:first-child{margin-bottom:12px}main{padding-top:24px}.card .body{padding:12px}.card button{padding:10px;font-size:13px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between"><div class="logo" onclick="go('home')">SEOUL <span>SIGNAL</span></div><button class="alt" id="accountBtn" onclick="go(state.user?'profile':'auth')">Войти</button></div><nav id="nav"></nav></div></header><main class="wrap" id="app"></main><footer class="footer"><div class="wrap">SEOUL SIGNAL · Демонстрационный прототип · Голосование не гарантирует концерт</div></footer><div class="toast" id="toast"></div><script>
const artists=[{id:'nova',name:'NOVA',type:'Solo',votes:2640,desc:'Энергичная хореография, мощный вокал и яркое шоу.',tone:'#8d468a'},{id:'orbit',name:'ORBIT',type:'Boy group',votes:2370,desc:'Танцевальные хиты и масштабные живые выступления.',tone:'#404e9a'},{id:'lumi',name:'LUMI',type:'Solo',votes:2160,desc:'Эмоциональный вокал и атмосферная музыка.',tone:'#aa506b'},{id:'pulse',name:'PULSE',type:'Girl group',votes:1980,desc:'Смелый стиль и запоминающиеся танцевальные номера.',tone:'#69418d'},{id:'zenith',name:'ZENITH',type:'Boy group',votes:1800,desc:'Мощная сценическая энергетика и большое фан-сообщество.',tone:'#346f8a'},{id:'aeri',name:'AERI',type:'Solo',votes:1530,desc:'Нежное звучание и выразительные выступления.',tone:'#95558d'}];
const cities=['Москва','Санкт-Петербург','Казань','Уфа','Екатеринбург','Новосибирск','Краснодар','Самара','Нижний Новгород','Ростов-на-Дону','Красноярск','Владивосток'];
const state=JSON.parse(localStorage.getItem('ss-demo')||'{"user":null,"votes":{},"subscribe":true}');let page='home',chosen='nova',city='Москва',pending=false,authMode='login';
const save=()=>localStorage.setItem('ss-demo',JSON.stringify(state)),el=()=>document.getElementById('app'),artist=()=>artists.find(a=>a.id===chosen);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function go(p){page=p;render();window.scrollTo(0,0)}
function choose(id){chosen=id;go('artist')}
function selectCity(v){city=v}
function beginVote(){if(state.votes[chosen])return go('share');if(!state.user){pending=true;authMode='login';return go('auth')}vote()}
function vote(){state.votes[chosen]=city;save();pending=false;go('success')}
function login(provider){state.user=provider==='email'?(document.getElementById('email')?.value||'Пользователь'):provider+' (демо)';save();if(pending)vote();else go('profile')}
function emailStep(){const e=document.getElementById('email');if(!e.value.includes('@'))return toast('Введите корректную почту');state.pendingEmail=e.value;save();authMode='code';render()}
function confirmEmail(){if((document.getElementById('code').value||'').length<4)return toast('Введите минимум 4 символа');state.user=state.pendingEmail;delete state.pendingEmail;save();if(pending)vote();else go('profile')}
function logout(){state.user=null;save();go('home')}
const btn=(text,fn,cls='')=>'<button class="'+cls+'" onclick="'+fn+'">'+text+'</button>';
function card(a){return '<div class="card"><div class="art" style="--tone:'+a.tone+'">'+a.name+'</div><div class="body"><span class="pill">'+a.type+'</span><h3>'+a.name+'</h3><p class="muted">'+a.votes.toLocaleString('ru-RU')+' голосов*</p>'+btn('Подробнее →',"choose('"+a.id+"')")+'</div></div>'}
function render(){document.getElementById('accountBtn').textContent=state.user?'Профиль':'Войти';document.getElementById('nav').innerHTML=[['home','Главная'],['catalog','Артисты'],['how','Как это работает'],['events','Афиша'],['about','О нас']].map(([id,t])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('');
let h='',a=artist();
if(page==='home')h='<section class="hero"><div class="eyebrow">K-POP · YOUR CITY · YOUR VOICE</div><h1>Твой голос.<br>Твой артист.<br><span class="accent">Твой город.</span></h1><p>Помоги любимому артисту приехать в твой город. Голосуй, приглашай друзей и узнавай первым о возможных концертах.</p><div class="actions">'+btn('Выбрать артиста →',"go('catalog')")+btn('Как это работает',"go('how')",'ghost')+'</div><p class="muted">6 артистов · 12 городов · демо-статистика</p></section><h2>Голосование открыто</h2><div class="grid">'+artists.slice(0,3).map(card).join('')+'</div><div class="actions">'+btn('Все артисты',"go('catalog')")+'</div><div class="panel"><div class="eyebrow">ДЕКАБРЬ 2026 · МОСКВА</div><h2>K-pop Festival</h2><p>Следи за анонсами и будущими событиями.</p>'+btn('Смотреть афишу',"go('events')")+'</div>';
if(page==='catalog')h='<h1>Выбери артиста</h1><p>Шесть кандидатов. Выбери, кого хочешь увидеть на сцене.</p><div class="grid">'+artists.map(card).join('')+'</div><p class="muted">* Статистика демонстрационная.</p>';
if(page==='artist')h=btn('← Все артисты',"go('catalog')",'ghost')+'<div class="panel"><div class="art" style="--tone:'+a.tone+';border-radius:14px">'+a.name+'</div><p class="eyebrow">'+a.type+'</p><h1>'+a.name+'</h1><p>'+a.desc+'</p><h3>'+a.votes.toLocaleString('ru-RU')+' голосов*</h3><div class="bar"><div style="width:'+a.votes/50+'%"></div></div><p class="muted">Демо-цель: 5 000 голосов</p><div class="form"><label>В каком городе хочешь увидеть артиста?</label><select onchange="selectCity(this.value)">'+cities.map(c=>'<option '+(c===city?'selected':'')+'>'+c+'</option>').join('')+'</select><div class="actions">'+(state.votes[chosen]?'<p>✓ Твой голос уже учтён: '+state.votes[chosen]+'</p>'+btn('Пригласить друзей',"go('share')"):btn('♥ Проголосовать','beginVote()'))+'</div></div><p class="muted">Голосование не гарантирует концерт. При достаточном интересе организаторы могут начать переговоры.</p></div>';
if(page==='auth')h='<div class="form panel"><h2>'+(authMode==='register'?'Регистрация':authMode==='code'?'Подтверждение email':'Авторизация')+'</h2><p>Для голосования нужен аккаунт.</p>'+(authMode==='code'?'<label>Код подтверждения для '+(state.pendingEmail||'email')+'</label><input id="code" placeholder="Любые 4 символа (демо)">'+btn('Подтвердить','confirmEmail()')+'<p class="muted">Демо: письмо не отправляется.</p>':btn('Войти через VK ID (демо)',"login('VK')",'alt')+' '+btn('Войти через Яндекс ID (демо)',"login('Яндекс')",'alt')+'<label>Электронная почта</label><input type="email" id="email" placeholder="you@example.com">'+(authMode==='register'?'<p><label><input style="width:auto" type="checkbox" id="sub" checked> Получать новости и специальные предложения</label></p>':'')+'<div class="actions">'+btn('Продолжить по email','emailStep()')+'</div>'+btn(authMode==='login'?'Зарегистрироваться':'Уже есть аккаунт? Войти',"authMode=authMode==='login'?'register':'login';render()",'ghost')+'<p class="muted">Все способы авторизации демонстрационные, OAuth не подключён.</p>')+'</div>';
if(page==='success')h='<div class="panel" style="text-align:center"><h1>♥ Голос принят!</h1><p>Ты поддержала '+a.name+' в городе '+state.votes[chosen]+'. Пригласи друзей, чтобы усилить интерес к концерту.</p>'+btn('Поделиться',"go('share')")+' '+btn('Мои голоса',"go('profile')",'ghost')+'</div>';
if(page==='share')h='<h1>Пригласи друзей</h1><p>Чем больше фанатов проголосуют, тем заметнее интерес к концерту в твоём городе.</p><div id="story" class="share-art"><div class="eyebrow" style="color:white">SEOUL SIGNAL</div><strong>'+a.name+'</strong><h2>Хочу увидеть в городе '+(state.votes[chosen]||city)+'!</h2><p>Голосуй со мной ♥</p></div><div class="actions">'+btn('ВКонтакте','shareVK()')+btn('Telegram','shareTG()')+btn('Скопировать ссылку','copyLink()','alt')+btn('Сохранить сторис PNG','saveStory()','ghost')+'</div>';
if(page==='profile')h='<h1>Личный кабинет</h1><div class="panel"><h3>'+(state.user||'Гость')+'</h3><p>Твои голоса:</p>'+(Object.entries(state.votes).map(([id,c])=>'<div class="panel"><strong>'+artists.find(x=>x.id===id).name+'</strong> · '+c+'<div class="actions">'+btn('Поделиться',"choose('"+id+"');go('share')")+'</div></div>').join('')||'<p>Пока нет голосов.</p>')+'<label><input type="checkbox" '+(state.subscribe?'checked':'')+' onchange="state.subscribe=this.checked;save()"> Получать новости и анонсы</label><div class="actions">'+btn('Выбрать артиста',"go('catalog')")+btn('Выйти','logout()','ghost')+'</div></div>';
if(page==='how')h='<h1>Как это работает</h1><div class="steps">'+[['01','Выбери артиста','Найди любимого исполнителя.'],['02','Укажи город','Выбери, где хочешь увидеть концерт.'],['03','Проголосуй','Авторизуйся и оставь голос.'],['04','Позови друзей','Больше голосов — сильнее сигнал организаторам.'],['05','Узнай первым','Получай новости и возможные привилегии, если концерт состоится.']].map(x=>'<div class="panel step"><b>'+x[0]+'</b><div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div></div>').join('')+'</div><p>Набранные голоса могут стать основанием для переговоров, но не гарантируют выступление.</p>'+btn('Перейти к голосованию',"go('catalog')");
if(page==='events')h='<h1>Ближайшие концерты</h1><div class="panel"><div class="eyebrow">ДЕКАБРЬ 2026 · МОСКВА</div><h2>K-pop Festival</h2><p>Место для подтверждённых дат, артистов, площадки, программы и ссылки на билеты.</p>'+btn('Подробнее',"go('festival')")+'</div><p class="muted">Демонстрационный анонс. Данные нужно подтвердить у организатора.</p>';
if(page==='festival')h=btn('← Афиша',"go('events')",'ghost')+'<h1>K-pop Festival — Москва</h1><div class="panel"><h3>Декабрь 2026</h3><p>Информация о программе, участниках, билетах и площадке появится после подтверждения организаторами.</p></div>'+btn('Поддержать артиста',"go('catalog')");
if(page==='about')h='<h1>Кто мы такие</h1><p>Команда организаторов K-pop мероприятий. Мы хотим, чтобы фанаты могли влиять на выбор будущих концертов.</p>'+['K-pop Night','Fan Meeting','K-pop Party'].map(x=>'<div class="panel"><h3>'+x+' — архив</h3><p>Место для фотоотчёта, даты и информации о прошедшем мероприятии.</p></div>').join('')+btn('Ближайшие концерты',"go('events')");
el().innerHTML=h;
}
function shareUrl(){return location.origin+location.pathname+'#artist-'+chosen}
function shareVK(){window.open('https://vk.com/share.php?url='+encodeURIComponent(shareUrl()),'_blank')}
function shareTG(){window.open('https://t.me/share/url?url='+encodeURIComponent(shareUrl())+'&text='+encodeURIComponent('Поддержи '+artist().name+' в моём городе!'),'_blank')}
function copyLink(){navigator.clipboard.writeText(shareUrl()).then(()=>toast('Ссылка скопирована')).catch(()=>toast('Не удалось скопировать'))}
function saveStory(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d');const g=c.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#793d9b');g.addColorStop(.5,'#e25b9e');g.addColorStop(1,'#211236');c.fillStyle=g;c.fillRect(0,0,1080,1920);c.fillStyle='white';c.textAlign='center';c.font='bold 55px Arial';c.fillText('SEOUL SIGNAL',540,360);c.font='bold 140px Arial';c.fillText(artist().name,540,850);c.font='bold 52px Arial';c.fillText('Хочу увидеть в городе',540,1040);c.fillText(state.votes[chosen]||city,540,1130);c.font='44px Arial';c.fillText('Голосуй со мной ♥',540,1400);const link=document.createElement('a');link.download='seoul-signal-story.png';link.href=canvas.toDataURL('image/png');link.click()}
if(location.hash.startsWith('#artist-')){const id=location.hash.slice(8);if(artists.some(a=>a.id===id)){chosen=id;page='artist'}}render();
</script></body></html>
